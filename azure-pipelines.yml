trigger:
- main

pool:
  name: Mycustomagentpool

steps:

- checkout: self

- powershell: |
    Write-Host "Building Docker image..."

    docker build -t mywebsite:latest .

    if ($LASTEXITCODE -ne 0) {
        throw "Docker image build failed."
    }
  displayName: 'Build Docker Image'

- powershell: |
    Write-Host "Checking existing container..."

    $container = docker ps -a -q -f "name=^mywebsite-container$"

    if ($container) {
        Write-Host "Removing existing container..."
        docker rm -f mywebsite-container
    }

    Write-Host "Starting new container..."

    docker run -d `
      --name mywebsite-container `
      --restart unless-stopped `
      -p 8080:80 `
      mywebsite:latest

    if ($LASTEXITCODE -ne 0) {
        throw "Container deployment failed."
    }
  displayName: 'Deploy Docker Container'

- powershell: |
    Start-Sleep -Seconds 3

    Write-Host "Checking container..."
    docker ps

    Write-Host "Checking website..."
    curl.exe --fail http://localhost:8080

    if ($LASTEXITCODE -ne 0) {
        throw "Website verification failed."
    }
  displayName: 'Verify Website'
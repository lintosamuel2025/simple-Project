trigger:
- main

pool:
  name: Mycustomagentpool

steps:

- checkout: self

- script: |
    "C:\Users\Administrator\AppData\Local\Programs\DockerDesktop\resources\bin\docker.exe" --version
    "C:\Users\Administrator\AppData\Local\Programs\DockerDesktop\resources\bin\docker.exe" build -t mywebsite:latest .
  displayName: 'Build Docker Image'

- powershell: |
    docker stop mywebsite-container 2>$null
    docker rm mywebsite-container 2>$null

    docker run -d `
      --name mywebsite-container `
      --restart unless-stopped `
      -p 8080:80 `
      mywebsite:latest
  displayName: 'Deploy Docker Container'

- powershell: |
    docker ps
    curl.exe http://localhost:8080
  displayName: 'Verify Website'
